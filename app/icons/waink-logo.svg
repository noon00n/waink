<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Colors arranged around the circle: teal top, magenta right, purple bottom, blue left -->
    <radialGradient id="cTeal" cx="0.44" cy="0.02" r="0.6">
      <stop offset="0" stop-color="#22c39a"/>
      <stop offset="0.5" stop-color="#1a9a8a" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#1a7f78" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cMagenta" cx="0.98" cy="0.58" r="0.66">
      <stop offset="0" stop-color="#ff2f7d"/>
      <stop offset="0.5" stop-color="#d5276f" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#d5276f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cPurple" cx="0.42" cy="1.0" r="0.62">
      <stop offset="0" stop-color="#b04ce0"/>
      <stop offset="0.55" stop-color="#9142c9" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#9142c9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cBlue" cx="0.02" cy="0.42" r="0.64">
      <stop offset="0" stop-color="#3d7cf0"/>
      <stop offset="0.55" stop-color="#3b5fd0" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#3b5fd0" stop-opacity="0"/>
    </radialGradient>
    <!-- Soft green between the teal top and the magenta right (around 1 o'clock) -->
    <radialGradient id="cGreen" cx="0.8" cy="0.16" r="0.42">
      <stop offset="0" stop-color="#4fdc8a" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#2fb874" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#2fb874" stop-opacity="0"/>
    </radialGradient>
    <!-- Darker, deeper center -->
    <radialGradient id="cCore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2a1b3d" stop-opacity="0.75"/>
      <stop offset="0.6" stop-color="#2a1b3d" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#2a1b3d" stop-opacity="0"/>
    </radialGradient>
    <!-- Glass highlight -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Petal: bright at the tip, fading toward the center -->
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="0.6" stop-color="#f3ecff" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#e6dcff" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="petalGlow" x="-60%" y="-30%" width="220%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="b"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.55"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="disc"><circle cx="256" cy="256" r="226"/></clipPath>
  </defs>

  <!-- No ring: the colored disc is the whole logo, scaled up to fill the icon -->
  <g transform="translate(256 256) scale(1.115) translate(-256 -256)">
  <!-- Disc with colors around the edge -->
  <g clip-path="url(#disc)">
    <circle cx="256" cy="256" r="226" fill="#3a2a55"/>
    <!-- Colors turned 10° counterclockwise to undo the phone's tilt in the reference photo -->
    <g transform="rotate(-10 256 256)">
      <rect width="512" height="512" fill="url(#cBlue)"/>
      <rect width="512" height="512" fill="url(#cPurple)"/>
      <rect width="512" height="512" fill="url(#cMagenta)"/>
      <rect width="512" height="512" fill="url(#cTeal)"/>
      <rect width="512" height="512" fill="url(#cGreen)"/>
    </g>
    <rect width="512" height="512" fill="url(#cCore)"/>
  </g>
  <circle cx="256" cy="256" r="225" fill="none" stroke="#000000" stroke-opacity="0.18" stroke-width="2"/>

  <!-- Six pointed, slightly see-through petals, evenly spaced: one straight up, one straight down -->
  <g filter="url(#petalGlow)" opacity="0.88">
    <path id="p" d="M256 106 C280 150, 278 200, 256 238 C234 200, 232 150, 256 106 Z" fill="url(#petal)"/>
    <use href="#p" transform="rotate(60 256 256)"/>
    <use href="#p" transform="rotate(120 256 256)"/>
    <use href="#p" transform="rotate(180 256 256)"/>
    <use href="#p" transform="rotate(240 256 256)"/>
    <use href="#p" transform="rotate(300 256 256)"/>
  </g>

  <!-- Glass highlight -->
  <ellipse cx="256" cy="150" rx="186" ry="112" fill="url(#gloss)" clip-path="url(#disc)"/>
  </g>
</svg>
